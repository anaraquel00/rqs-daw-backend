name: Mastering Lockfile Fix Probe

on:
  push:
    branches:
      - integration/mastering-v2-secure-p1-20260816
    paths:
      - .github/workflows/mastering-lockfile-probe.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: integration/mastering-v2-secure-p1-20260816

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Generate and verify exact lockfile-only audit fix
        run: |
          npm audit fix --package-lock-only
          git diff -- package-lock.json
          test -n "$(git status --short package-lock.json)"
          npm audit --package-lock-only

      - name: Commit exact generated lockfile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'fix(deps): apply npm audit lockfile fix'
          git push origin HEAD:integration/mastering-v2-secure-p1-20260816
