name: Mastering Lockfile Fix Probe

on:
  push:
    branches:
      - integration/mastering-v2-secure-p1-20260816
    paths:
      - .github/workflows/mastering-lockfile-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Generate lockfile-only audit fix
        run: |
          npm audit fix --package-lock-only
          git diff -- package-lock.json > mastering-lockfile.patch
          test -s mastering-lockfile.patch

      - name: Verify fixed lockfile audit
        run: npm audit --package-lock-only

      - name: Upload exact lockfile patch
        uses: actions/upload-artifact@v4
        with:
          name: mastering-lockfile-patch
          path: mastering-lockfile.patch
          if-no-files-found: error
          retention-days: 1
