name: Uplink Review Validation

on:
  pull_request:
    paths:
      - ".github/workflows/uplink-review.yml"
      - "supabase/review/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: uplink-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Deno, SQL and repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.5

      - name: Check and test Uplink router
        working-directory: supabase/review/rqs-router
        run: |
          deno task check
          deno task test
          deno fmt --check \
            index.ts \
            index.rollback-safe.ts \
            tracking.ts \
            tracking_test.ts \
            index_test.ts

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Parse review SQL
        run: |
          python -m pip install --disable-pip-version-check pglast==8.4
          python - <<'PY'
          from pathlib import Path
          from pglast import parse_sql

          root = Path("supabase/review")
          files = (
              "uplink_tracking_audit.sql",
              "uplink_tracking_migration.sql",
              "uplink_tracking_rollback.sql",
              "uplink_tracking_tests.sql",
          )
          for name in files:
              parse_sql((root / name).read_text(encoding="utf-8"))
              print(f"SQL PARSE PASS: {name}")
          PY

      - name: Install Node dependencies
        run: npm ci --ignore-scripts

      - name: Check JavaScript syntax
        run: |
          while IFS= read -r file; do
            node --check "$file"
          done < <(
            find . -type d -name node_modules -prune \
              -o -name '*.js' -type f -print
          )

      - name: Audit high-severity Node dependencies
        run: npm audit --audit-level=high
