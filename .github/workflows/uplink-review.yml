name: Uplink Review Validation

on:
  pull_request:
    paths:
      - ".github/workflows/uplink-review.yml"
      - "supabase/review/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: uplink-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Deno, SQL and repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGDATABASE: postgres
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.5

      - name: Check and test Uplink router
        working-directory: supabase/review/rqs-router
        run: |
          deno task check
          deno task test
          deno fmt --check \
            index.ts \
            index.rollback-safe.ts \
            tracking.ts \
            tracking_test.ts \
            index_test.ts

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Parse review SQL
        run: |
          python -m pip install --disable-pip-version-check pglast==8.4
          python - <<'PY'
          from pathlib import Path
          from pglast import parse_sql

          root = Path("supabase/review")
          files = (
              "ci/uplink_tracking_fixture.sql",
              "ci/uplink_dedup_retention_cron_fixture.sql",
              "uplink_tracking_audit.sql",
              "uplink_tracking_migration.sql",
              "uplink_tracking_rollback.sql",
              "uplink_tracking_tests.sql",
              "uplink_dedup_retention_audit.sql",
              "uplink_dedup_retention_migration.sql",
              "uplink_dedup_retention_rollback.sql",
              "uplink_dedup_retention_tests.sql",
          )
          for name in files:
              parse_sql((root / name).read_text(encoding="utf-8"))
              print(f"SQL PARSE PASS: {name}")
          PY

      - name: Execute migration and rollback-safe SQL tests in ephemeral PostgreSQL
        run: |
          psql -v ON_ERROR_STOP=1 \
            -f supabase/review/ci/uplink_tracking_fixture.sql
          psql -v ON_ERROR_STOP=1 \
            -f supabase/review/uplink_tracking_migration.sql
          psql -v ON_ERROR_STOP=1 \
            -f supabase/review/uplink_tracking_tests.sql

      - name: Execute fail-closed Uplink retention SQL matrix
        run: |
          pre_enable_audit="$RUNNER_TEMP/uplink-retention-pre-enable-audit.log"
          psql -v ON_ERROR_STOP=1 \
            -o "$pre_enable_audit" \
            -f supabase/review/uplink_dedup_retention_audit.sql
          cat "$pre_enable_audit"
          grep -F "PG_CRON = ABSENT" "$pre_enable_audit"

          if psql -v ON_ERROR_STOP=1 \
            -f supabase/review/uplink_dedup_retention_migration.sql; then
            echo "Expected missing-pg_cron preflight failure" >&2
            exit 1
          fi

          psql -v ON_ERROR_STOP=1 \
            -f supabase/review/ci/uplink_dedup_retention_cron_fixture.sql

          fixture_audit="$RUNNER_TEMP/uplink-retention-cron-fixture-audit.log"
          psql -v ON_ERROR_STOP=1 \
            -o "$fixture_audit" \
            -f supabase/review/uplink_dedup_retention_audit.sql
          cat "$fixture_audit"
          grep -F "CRON_JOB = AVAILABLE" "$fixture_audit"
          grep -F "CRON_JOB_RUN_DETAILS = AVAILABLE" "$fixture_audit"

          psql -v ON_ERROR_STOP=1 \
            -c "grant delete on public.rqs_uplink_click_dedup to authenticated"
          if psql -v ON_ERROR_STOP=1 \
            -f supabase/review/uplink_dedup_retention_migration.sql; then
            echo "Expected broad-privilege preflight failure" >&2
            exit 1
          fi
          psql -v ON_ERROR_STOP=1 \
            -c "revoke delete on public.rqs_uplink_click_dedup from authenticated"

          psql -v ON_ERROR_STOP=1 \
            -c "create policy retention_negative_control on public.rqs_uplink_click_dedup for select to authenticated using (true)"
          if psql -v ON_ERROR_STOP=1 \
            -f supabase/review/uplink_dedup_retention_migration.sql; then
            echo "Expected broad-policy preflight failure" >&2
            exit 1
          fi
          psql -v ON_ERROR_STOP=1 \
            -c "drop policy retention_negative_control on public.rqs_uplink_click_dedup"

          psql -v ON_ERROR_STOP=1 \
            -f supabase/review/uplink_dedup_retention_migration.sql
          psql -v ON_ERROR_STOP=1 \
            -f supabase/review/uplink_dedup_retention_audit.sql
          psql -v ON_ERROR_STOP=1 \
            -f supabase/review/uplink_dedup_retention_tests.sql

          if psql -v ON_ERROR_STOP=1 \
            -f supabase/review/uplink_dedup_retention_migration.sql; then
            echo "Expected duplicate-job preflight failure" >&2
            exit 1
          fi

          psql -v ON_ERROR_STOP=1 \
            -f supabase/review/uplink_dedup_retention_rollback.sql
          psql -v ON_ERROR_STOP=1 \
            -f supabase/review/uplink_dedup_retention_migration.sql
          psql -v ON_ERROR_STOP=1 \
            -f supabase/review/uplink_dedup_retention_tests.sql
          psql -v ON_ERROR_STOP=1 \
            -f supabase/review/uplink_dedup_retention_rollback.sql

      - name: Install Node dependencies
        run: npm ci --ignore-scripts

      - name: Check JavaScript syntax
        run: |
          while IFS= read -r file; do
            node --check "$file"
          done < <(
            find . -type d -name node_modules -prune \
              -o -name '*.js' -type f -print
          )

      - name: Audit high-severity Node dependencies
        run: npm audit --audit-level=high
