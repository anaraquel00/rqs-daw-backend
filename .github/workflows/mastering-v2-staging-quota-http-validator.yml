name: Mastering V2 Staging HTTP Quota Validator

on:
  push:
    branches:
      - integration/mastering-v2-secure-p1-20260816
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-staging-quota-http-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse PowerShell validators
        shell: pwsh
        run: |
          foreach ($path in @(
            'scripts/Test-MasteringV2StagingQuotaHttp.ps1',
            'scripts/Test-MasteringV2StagingQuotaHttpSbSecret.ps1'
          )) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $PWD $path),
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "${path}: $($_.Message)" }
              exit 1
            }
          }
          Write-Host 'STAGING_QUOTA_HTTP_VALIDATOR_SYNTAX: PASS'

      - name: Verify staging-only and secret-safe contract
        shell: bash
        run: |
          set -euo pipefail
          FILE='scripts/Test-MasteringV2StagingQuotaHttp.ps1'
          WRAPPER='scripts/Test-MasteringV2StagingQuotaHttpSbSecret.ps1'
          grep -F -q 'uwrqbywapomuloresoek' "$FILE"
          grep -F -q 'RQS_STAGING_SUPABASE_PUBLISHABLE_KEY' "$FILE"
          grep -F -q "Read-Host 'STAGING server secret/service-role key' -AsSecureString" "$FILE"
          grep -F -q 'S3_REQUESTS_PERFORMED: NONE' "$FILE"
          grep -F -q 'PRODUCTION_REQUESTS_PERFORMED: NONE' "$FILE"
          grep -F -q 'SECRETS_PRINTED: NONE' "$FILE"
          grep -F -q 'STAGING_QUOTA_HTTP_CLEANUP: PASS' "$FILE"
          grep -F -q 'Invoke-WebRequest:UserAgent' "$WRAPPER"
          grep -F -q 'rqs-mastering-v2-staging-validator/1.0' "$WRAPPER"
          grep -F -q 'Test-MasteringV2StagingQuotaHttp.ps1' "$WRAPPER"
          if grep -F -q 'ucearnthodrltkvkmhit' "$FILE" "$WRAPPER"; then
            echo 'ERROR: production Supabase ref leaked into staging quota HTTP validator.'
            exit 1
          fi
          if grep -F -q 'amzn-rqs-bunker-sa' "$FILE" "$WRAPPER"; then
            echo 'ERROR: production S3 bucket leaked into staging quota HTTP validator.'
            exit 1
          fi
          echo 'STAGING_QUOTA_HTTP_VALIDATOR_ISOLATION: PASS'
          echo 'STAGING_QUOTA_HTTP_SB_SECRET_UA_GUARD: PASS'
