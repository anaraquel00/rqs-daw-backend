name: Mastering V2 Secure Integration

on:
  push:
    branches:
      - integration/mastering-v2-secure-p1-20260816
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGDATABASE: postgres
      PGUSER: postgres

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check PowerShell local launcher syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'scripts/Start-MasteringV2LocalIntegration.ps1'),
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          Write-Host 'MASTERING_V2_LOCAL_LAUNCHER_SYNTAX: PASS'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest pip-audit pglast==8.4

      - name: Gate Python dependency vulnerabilities
        run: python -m pip_audit --progress-spinner off

      - name: Run Python tests
        run: python -m pytest -q

      - name: Validate V2 capabilities CLI
        run: python -m src.controllers.mastering_v2_cli capabilities

      - name: Parse Mastering V2 review SQL
        run: |
          python - <<'PY'
          from pathlib import Path
          from pglast import parse_sql

          root = Path('supabase/review')
          files = (
              'ci/mastering_v2_security_fixture.sql',
              'mastering_v2_security_migration.sql',
              'mastering_v2_security_audit.sql',
              'mastering_v2_security_tests.sql',
              'mastering_v2_security_rollback.sql',
          )
          for name in files:
              parse_sql((root / name).read_text(encoding='utf-8'))
              print(f'SQL PARSE PASS: {name}')
          PY

      - name: Execute Mastering V2 migration and SQL tests in ephemeral PostgreSQL
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/review/ci/mastering_v2_security_fixture.sql
          psql -v ON_ERROR_STOP=1 -f supabase/review/mastering_v2_security_migration.sql
          psql -v ON_ERROR_STOP=1 -f supabase/review/mastering_v2_security_tests.sql
          psql -v ON_ERROR_STOP=1 -f supabase/review/mastering_v2_security_audit.sql
          psql -v ON_ERROR_STOP=1 <<'SQL'
          do $assert$
          begin
            if to_regclass('public.mastering_quota_reservations') is null then
              raise exception 'CI_RESERVATION_TABLE_MISSING';
            end if;

            if exists (
              select 1
              from pg_proc p
              join pg_namespace n on n.oid = p.pronamespace
              where n.nspname = 'public'
                and p.proname in (
                  'reserve_mastering_quota',
                  'confirm_mastering_quota',
                  'release_mastering_quota'
                )
                and (
                  p.prosecdef
                  or p.proconfig is distinct from array['search_path=""']::text[]
                  or has_function_privilege('anon', p.oid, 'EXECUTE')
                  or has_function_privilege('authenticated', p.oid, 'EXECUTE')
                  or not has_function_privilege('service_role', p.oid, 'EXECUTE')
                )
            ) then
              raise exception 'CI_MASTERING_RPC_SECURITY_CONTRACT_FAILED';
            end if;

            if exists (
              select 1
              from public.mastering_quota_reservations
              where user_id in (
                'bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbb1'::uuid,
                'bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbb2'::uuid
              )
            ) then
              raise exception 'CI_MASTERING_FIXTURE_CLEANUP_FAILED';
            end if;
          end;
          $assert$;
          SQL

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Gate complete Node dependency audit
        run: npm audit

      - name: Check Node transport syntax
        run: |
          node --check server.js
          node --check scripts/mastering-v2-local-server.js
          node --check src/lib/supabase-server.js
          node --check src/controllers/payment.js
          node --check src/controllers/mastering-v2.js
          node --check tests/mastering_v2_auth_unit.mjs
          node --check tests/mastering_v2_auth_http_e2e.mjs
          node --check tests/mastering_v2_security_sql_contract.mjs
          node --check tests/mastering_v2_http_e2e.mjs
          node --check tests/mastering_v2_security_e2e.mjs

      - name: Validate auth and ownership helpers
        run: node tests/mastering_v2_auth_unit.mjs

      - name: Validate production-like auth middleware over HTTP
        run: node tests/mastering_v2_auth_http_e2e.mjs

      - name: Validate security SQL contract
        run: node tests/mastering_v2_security_sql_contract.mjs

      - name: Verify legacy Full Master bypass is retired
        run: |
          grep -F "app.post('/mastering/process'" server.js
          grep -F "LEGACY_MASTERING_PROCESS_RETIRED" server.js

      - name: Run local Mastering V2 HTTP E2E
        run: node tests/mastering_v2_http_e2e.mjs

      - name: Run Mastering V2 security E2E
        run: node tests/mastering_v2_security_e2e.mjs
