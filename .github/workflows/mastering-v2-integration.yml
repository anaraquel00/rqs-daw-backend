name: Mastering V2 Secure Integration

on:
  push:
    branches:
      - integration/mastering-v2-secure-p1-20260816
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGDATABASE: postgres
      PGUSER: postgres

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check PowerShell local launcher syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'scripts/Start-MasteringV2LocalIntegration.ps1'),
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          Write-Host 'MASTERING_V2_LOCAL_LAUNCHER_SYNTAX: PASS'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest pip-audit pglast==8.4

      - name: Gate Python dependency vulnerabilities
        run: python -m pip_audit --progress-spinner off

      - name: Run Python tests
        run: python -m pytest -q

      - name: Validate V2 capabilities CLI
        run: python -m src.controllers.mastering_v2_cli capabilities

      - name: Parse Mastering V2 review SQL
        run: |
          python - <<'PY'
          from pathlib import Path
          from pglast import parse_sql

          root = Path('supabase/review')
          files = (
              'ci/mastering_v2_security_fixture.sql',
              'ci/mastering_v2_staging_fixture.sql',
              'mastering_v2_staging_baseline.sql',
              'mastering_v2_staging_baseline_rollback.sql',
              'mastering_v2_security_migration.sql',
              'mastering_v2_security_audit.sql',
              'mastering_v2_security_tests.sql',
              'mastering_v2_security_rollback.sql',
              'mastering_v2_auth_profile_hardening.sql',
              'mastering_v2_auth_profile_hardening_rollback.sql',
          )
          for name in files:
              parse_sql((root / name).read_text(encoding='utf-8'))
              print(f'SQL PARSE PASS: {name}')
          PY

      - name: Validate observed production ACL migration path
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/review/ci/mastering_v2_security_fixture.sql
          psql -v ON_ERROR_STOP=1 -f supabase/review/mastering_v2_security_migration.sql
          psql -v ON_ERROR_STOP=1 -f supabase/review/mastering_v2_security_tests.sql
          psql -v ON_ERROR_STOP=1 -f supabase/review/mastering_v2_security_audit.sql

          psql -v ON_ERROR_STOP=1 <<'SQL'
          do $assert$
          begin
            if to_regclass('public.mastering_quota_reservations') is null then
              raise exception 'CI_RESERVATION_TABLE_MISSING';
            end if;

            if has_table_privilege('authenticated', 'public.profiles', 'INSERT')
               or has_table_privilege('authenticated', 'public.profiles', 'UPDATE')
               or has_table_privilege('authenticated', 'public.profiles', 'DELETE')
               or has_column_privilege('authenticated', 'public.profiles', 'role', 'UPDATE')
               or has_column_privilege('authenticated', 'public.profiles', 'completed_masters', 'UPDATE')
               or has_table_privilege('anon', 'public.profiles', 'UPDATE') then
              raise exception 'CI_BROWSER_PROFILE_WRITE_AUTHORITY_NOT_RETIRED';
            end if;

            if exists (
              select 1 from pg_policies
              where schemaname='public' and tablename='profiles' and cmd='UPDATE'
            ) then
              raise exception 'CI_PROFILE_UPDATE_POLICY_REMAINS';
            end if;

            if exists (
              select 1
              from pg_proc p
              join pg_namespace n on n.oid = p.pronamespace
              where n.nspname = 'public'
                and p.proname in (
                  'reserve_mastering_quota',
                  'confirm_mastering_quota',
                  'release_mastering_quota'
                )
                and (
                  p.prosecdef
                  or p.proconfig is distinct from array['search_path=""']::text[]
                  or has_function_privilege('anon', p.oid, 'EXECUTE')
                  or has_function_privilege('authenticated', p.oid, 'EXECUTE')
                  or not has_function_privilege('service_role', p.oid, 'EXECUTE')
                )
            ) then
              raise exception 'CI_MASTERING_RPC_SECURITY_CONTRACT_FAILED';
            end if;
          end;
          $assert$;
          SQL

          psql -v ON_ERROR_STOP=1 -f supabase/review/mastering_v2_security_rollback.sql

          psql -v ON_ERROR_STOP=1 <<'SQL'
          do $rollback_assert$
          begin
            if to_regclass('public.mastering_quota_reservations') is not null then
              raise exception 'CI_ROLLBACK_RESERVATION_TABLE_REMAINS';
            end if;

            if to_regprocedure('public.reserve_mastering_quota(uuid,uuid)') is not null
               or to_regprocedure('public.confirm_mastering_quota(uuid,uuid)') is not null
               or to_regprocedure('public.release_mastering_quota(uuid,uuid)') is not null then
              raise exception 'CI_ROLLBACK_RPC_REMAINS';
            end if;

            if has_table_privilege('authenticated', 'public.profiles', 'UPDATE') then
              raise exception 'CI_ROLLBACK_RESTORED_TABLE_LEVEL_UPDATE';
            end if;

            if not has_column_privilege('authenticated','public.profiles','completed_masters','UPDATE')
               or has_column_privilege('authenticated','public.profiles','role','UPDATE') then
              raise exception 'CI_ROLLBACK_SAFE_LEGACY_COLUMN_ACL_FAILED';
            end if;

            if (select count(*) from pg_policies
                where schemaname='public' and tablename='profiles' and cmd='UPDATE'
                  and policyname='Permitir que usuários atualizem seus próprios perfis') <> 1 then
              raise exception 'CI_ROLLBACK_OWN_PROFILE_UPDATE_POLICY_MISSING';
            end if;

            if has_table_privilege('anon', 'public.profiles', 'UPDATE') then
              raise exception 'CI_ROLLBACK_ANON_UPDATE_EXPOSED';
            end if;
          end;
          $rollback_assert$;
          SQL

      - name: Validate observed isolated staging alignment path
        run: |
          createdb mastering_staging_ci
          PGDATABASE=mastering_staging_ci psql -v ON_ERROR_STOP=1 -f supabase/review/ci/mastering_v2_staging_fixture.sql
          PGDATABASE=mastering_staging_ci psql -v ON_ERROR_STOP=1 -f supabase/review/mastering_v2_staging_baseline.sql
          PGDATABASE=mastering_staging_ci psql -v ON_ERROR_STOP=1 -f supabase/review/mastering_v2_security_migration.sql
          PGDATABASE=mastering_staging_ci psql -v ON_ERROR_STOP=1 -f supabase/review/mastering_v2_security_tests.sql
          PGDATABASE=mastering_staging_ci psql -v ON_ERROR_STOP=1 -f supabase/review/mastering_v2_security_audit.sql
          PGDATABASE=mastering_staging_ci psql -v ON_ERROR_STOP=1 -f supabase/review/mastering_v2_security_rollback.sql
          PGDATABASE=mastering_staging_ci psql -v ON_ERROR_STOP=1 -f supabase/review/mastering_v2_staging_baseline_rollback.sql

          PGDATABASE=mastering_staging_ci psql -v ON_ERROR_STOP=1 <<'SQL'
          do $staging_rollback_assert$
          begin
            if exists (
              select 1 from information_schema.columns
              where table_schema='public' and table_name='profiles'
                and column_name in ('email','completed_masters')
            ) then
              raise exception 'CI_STAGING_BASELINE_ROLLBACK_COLUMNS_REMAIN';
            end if;

            if (select c.relrowsecurity from pg_class c
                join pg_namespace n on n.oid=c.relnamespace
                where n.nspname='public' and c.relname='profiles') then
              raise exception 'CI_STAGING_BASELINE_ROLLBACK_RLS_REMAINS';
            end if;

            if (select count(*) from pg_policies
                where schemaname='public' and tablename='profiles') <> 0 then
              raise exception 'CI_STAGING_BASELINE_ROLLBACK_POLICIES_REMAIN';
            end if;

            if (select count(*) from public.profiles) <> 1 then
              raise exception 'CI_STAGING_UPLINK_SYNTHETIC_PROFILE_NOT_PRESERVED';
            end if;
          end;
          $staging_rollback_assert$;
          SQL

          dropdb mastering_staging_ci

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Gate complete Node dependency audit
        run: npm audit

      - name: Check Node transport syntax
        run: |
          node --check server.js
          node --check scripts/mastering-v2-local-server.js
          node --check src/lib/supabase-server.js
          node --check src/controllers/payment.js
          node --check src/controllers/mastering-v2.js
          node --check tests/mastering_v2_auth_unit.mjs
          node --check tests/mastering_v2_auth_http_e2e.mjs
          node --check tests/mastering_v2_security_sql_contract.mjs
          node --check tests/mastering_v2_http_e2e.mjs
          node --check tests/mastering_v2_security_e2e.mjs

      - name: Validate auth and ownership helpers
        run: node tests/mastering_v2_auth_unit.mjs

      - name: Validate production-like auth middleware over HTTP
        run: node tests/mastering_v2_auth_http_e2e.mjs

      - name: Validate security SQL contract
        run: node tests/mastering_v2_security_sql_contract.mjs

      - name: Verify legacy Full Master bypass is retired
        run: |
          grep -F "app.post('/mastering/process'" server.js
          grep -F "LEGACY_MASTERING_PROCESS_RETIRED" server.js

      - name: Run local Mastering V2 HTTP E2E
        run: node tests/mastering_v2_http_e2e.mjs

      - name: Run Mastering V2 security E2E
        run: node tests/mastering_v2_security_e2e.mjs
